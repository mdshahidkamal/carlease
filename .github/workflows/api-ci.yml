name: Backend API CI

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    paths:
      - "backend/**"
      - "tests/**"
      - "ecs/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/api-image.yml"
      - ".github/workflows/api-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "ecs/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/api-image.yml"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            backend/CarLease.Api.csproj
            tests/CarLease.Api.Tests/CarLease.Api.Tests.csproj

      - name: Restore solution
        run: dotnet restore backend/CarLease.Api.sln

      - name: Build solution
        run: dotnet build backend/CarLease.Api.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/CarLease.Api.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7

  docker-validation:
    name: Validate API Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Docker build
        run: docker build --pull --tag carlease-api:ci ./backend
