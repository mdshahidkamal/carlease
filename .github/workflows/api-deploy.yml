name: Backend API - Promote image to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character Git commit SHA of an image already published to ECR"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-api-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: carlease-api
  ECS_CLUSTER: carlease-cluster

jobs:
  deploy:
    name: Promote selected image to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate image and production configuration
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          AWS_PRODUCTION_ROLE_ARN: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character Git commit SHA"; exit 1; }
          for name in AWS_PRODUCTION_ROLE_ARN DATABASE_SECRET_ARN FRONTEND_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production environment secret/variable: $name"
              exit 1
            fi
          done

      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve and verify previously published ECR image
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Generate production task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("ecs/task-definition-production.json", encoding="utf-8") as source:
              task = json.load(source)

          containers = task.get("containerDefinitions", [])
          if len(containers) != 1 or containers[0].get("name") != "carlease-api":
              raise SystemExit("Unexpected production task definition container structure")

          container = containers[0]
          container["image"] = os.environ["IMAGE_URI"]
          container["secrets"] = [{
              "name": "ConnectionStrings__DefaultConnection",
              "valueFrom": os.environ["DATABASE_SECRET_ARN"]
          }]

          for item in container.get("environment", []):
              if item.get("name") == "FrontendUrl":
                  item["value"] = os.environ["FRONTEND_URL"]

          with open("ecs/task-definition-production.generated.json", "w", encoding="utf-8") as target:
              json.dump(task, target, indent=2)
          PY

      - name: Deploy production ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs/task-definition-production.generated.json
          service: carlease-api-prod
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
