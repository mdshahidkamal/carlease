name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ecs-task-definition.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: carlease-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test API
        run: dotnet build backend/CarLease.Api.csproj --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE_URI" ./backend
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Generate ECS task definition
        run: |
          python3 - <<'PY'
          import json
          import os
          with open("ecs-task-definition.json", "r", encoding="utf-8") as source:
              task = json.load(source)
          task["executionRoleArn"] = "${{ secrets.ECS_EXECUTION_ROLE_ARN }}"
          task["taskRoleArn"] = "${{ secrets.ECS_TASK_ROLE_ARN }}"
          container = task["containerDefinitions"][0]
          container["image"] = os.environ["IMAGE_URI"]
          container["secrets"][0]["valueFrom"] = "${{ secrets.DATABASE_SECRET_ARN }}"
          container["logConfiguration"]["options"]["awslogs-region"] = "${{ secrets.AWS_REGION }}"
          for item in container["environment"]:
              if item["name"] == "FrontendUrl":
                  item["value"] = "${{ secrets.FRONTEND_URL }}"
          with open("ecs-task-definition.generated.json", "w", encoding="utf-8") as target:
              json.dump(task, target)
          PY

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs-task-definition.generated.json
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
