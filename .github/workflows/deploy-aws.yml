name: CarLease AWS Deployment

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ecs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: carlease-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: carlease-api
  ECS_CLUSTER: carlease-cluster

jobs:
  deploy:
    name: Build and deploy CarLease
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select environment
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "environment=nonprod" >> "$GITHUB_OUTPUT"
            echo "service=carlease-api-nonprod" >> "$GITHUB_OUTPUT"
            echo "task_family=carlease-api-nonprod" >> "$GITHUB_OUTPUT"
            echo "target_group=carlease-api-nonprod-tg" >> "$GITHUB_OUTPUT"
            echo "secret_name=carlease/nonprod/database-connection-string" >> "$GITHUB_OUTPUT"
            echo "task_definition=ecs/task-definition-nonprod.json" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::996661624843:role/carlease/carlease-github-nonprod-deploy-role" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "service=carlease-api-prod" >> "$GITHUB_OUTPUT"
            echo "task_family=carlease-api-prod" >> "$GITHUB_OUTPUT"
            echo "target_group=carlease-api-prod-tg" >> "$GITHUB_OUTPUT"
            echo "secret_name=carlease/prod/database-connection-string" >> "$GITHUB_OUTPUT"
            echo "task_definition=ecs/task-definition-production.json" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::996661624843:role/carlease/carlease-github-production-deploy-role" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported deployment branch: ${GITHUB_REF}"
            exit 1
          fi

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push combined React + .NET image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull \
            --file backend/Dockerfile \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="$MAPS_KEY" \
            --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Resolve database connection secret ARN
        id: dbsecret
        env:
          SECRET_NAME: ${{ steps.target.outputs.secret_name }}
        run: |
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query ARN --output text)
          if [[ -z "$SECRET_ARN" || "$SECRET_ARN" == "None" ]]; then
            echo "Missing database connection secret: $SECRET_NAME"
            exit 1
          fi
          echo "secret_arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          SECRET_ARN: ${{ steps.dbsecret.outputs.secret_arn }}
          TASK_DEFINITION_FILE: ${{ steps.target.outputs.task_definition }}
        run: |
          jq --arg image "$IMAGE_URI" --arg secret "$SECRET_ARN" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].secrets = [
                {
                  "name": "ConnectionStrings__DefaultConnection",
                  "valueFrom": $secret
                }
              ]
          ' "$TASK_DEFINITION_FILE" > /tmp/carlease-task-definition.json

      - name: Register ECS task definition
        id: taskdef
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/carlease-task-definition.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Create or update ECS service
        env:
          SERVICE_NAME: ${{ steps.target.outputs.service }}
          TARGET_GROUP_NAME: ${{ steps.target.outputs.target_group }}
          TASK_DEFINITION_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
        run: |
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$SERVICE_NAME" \
            --query 'services[0].status' --output text)

          if [[ "$SERVICE_STATUS" == "None" || "$SERVICE_STATUS" == "INACTIVE" ]]; then
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$SERVICE_NAME" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --desired-count 1 \
              --launch-type FARGATE \
              --platform-version LATEST \
              --deployment-controller type=ECS \
              --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100" \
              --health-check-grace-period-seconds 90 \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-02ac43e8cb8a006cc,subnet-024f83979cdb7e279],securityGroups=[sg-0b33604d7af8971f9],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=$TARGET_GROUP_ARN,containerName=carlease-api,containerPort=8080" \
              --tags key=Project,value=CarLease key=Environment,value=${{ steps.target.outputs.environment }}
          else
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE_NAME" \
              --task-definition "$TASK_DEFINITION_ARN" \
              --desired-count 1
          fi

      - name: Wait for service stability
        env:
          SERVICE_NAME: ${{ steps.target.outputs.service }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE_NAME"

      - name: Show temporary AWS test URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names carlease-shared-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "CarLease endpoint: http://$ALB_DNS"
          echo "Environment: ${{ steps.target.outputs.environment }}"
